<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Pribadi</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0edff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .profil {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 25px #00000015;
        }

        .profil img {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #7955e8;
            margin-bottom: 15px;
        }

        h1 {
            color: #30234f;
            font-size: 25px;
            margin-bottom: 8px;
        }

        h3 {
            color: #7955e8;
            font-size: 16px;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 15px;
        }

        .keahlian {
            background: #f0edff;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #49338a;
            font-size: 13px;
        }

        .tombol {
            display: inline-block;
            background: #7955e8;
            color: white;
            padding: 11px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
        }

        .tombol:hover {
            background: #5838c5;
        }
    </style>
</head>

<body>

    <div class="profil">
        <img
            src="WhatsApp Image 2026-10-17 at 08.12.52 (1).jpeg"
            alt="Foto Profil">

        <h1>Sri Rahmawati</h1>
        <h3>Mahasiswa Informatika</h3>

        <p>
            Halo! Saya mahasiswa informatika
            dari fakultas Teknik Komputer
            pada universitas cokroaminoto palopo.
        </p>

        <div class="keahlian">
            <strong>Alamat</strong><br>
            Lamasi
        </div>

        <p>
            📧 srir97308@gmail.com<br>
        </p>

        <a class="tombol"
           href="https://instagram.com/"
           target="_blank"
           rel="noopener noreferrer">
            Instagram Saya
        </a>
    </div>

</body>
</html>
